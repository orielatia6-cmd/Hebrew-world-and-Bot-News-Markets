openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Health endpoint for the Telegram news bot
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: briefing
    description: News briefing operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /briefing/sources:
    get:
      operationId: getNewsSourcesHealth
      tags: [briefing]
      summary: Get news source health
      description: Returns the latest fetch status for every configured news source
      responses:
        "200":
          description: News source health
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NewsSourceHealth"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    NewsSourceHealth:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        category:
          type: string
          enum: [world, trump, markets]
        lastAttemptAt:
          type: ["string", "null"]
          format: date-time
        lastSuccessfulFetch:
          type: ["string", "null"]
          format: date-time
        lastError:
          type: ["string", "null"]
        recentStoryCount:
          type: integer
      required:
        - id
        - name
        - category
        - lastAttemptAt
        - lastSuccessfulFetch
        - lastError
        - recentStoryCount
