name: Briefline Telegram digests

on:
  # GitHub starts a run every 15 minutes; the application evaluates hourly
  # digest slots and breaking-news alerts using Israel time. Starts may be delayed.
  schedule:
  - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose the scheduled bot, a database-only maintenance action, or offline regression tests"
        required: true
        type: choice
        options:
          - scheduled
          - regression-test
          - schema-check
          - delivery-audit
          - migration-preflight
          - apply-news-quality-migration
        default: scheduled
      confirm_news_quality_migration:
        description: "Set true only to apply the approved additive migration"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: briefline-neon-job
  cancel-in-progress: false

jobs:
  briefing:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode != 'regression-test' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/api-server run build
      - name: Read-only database schema check
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'schema-check' }}
        run: node artifacts/api-server/dist/github.mjs --schema-check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Read-only recent-delivery audit
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'delivery-audit' }}
        run: node artifacts/api-server/dist/github.mjs --delivery-audit
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Read-only migration preflight
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'migration-preflight' }}
        run: node artifacts/api-server/dist/github.mjs --migration-preflight
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Require migration confirmation
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'apply-news-quality-migration' && inputs.confirm_news_quality_migration != true }}
        run: |
          echo "Migration was not applied: explicit confirmation input is required."
          exit 1
      - name: Apply additive migration atomically
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'apply-news-quality-migration' && inputs.confirm_news_quality_migration == true }}
        run: node artifacts/api-server/dist/github.mjs --apply-news-quality-migration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Run scheduled Telegram job
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'scheduled' }}
        run: node artifacts/api-server/dist/github.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BRIEFING_FULL_ARTICLE_CONTEXT_ENABLED: ${{ vars.BRIEFING_FULL_ARTICLE_CONTEXT_ENABLED || 'false' }}

  regression-test:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'regression-test' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/api-server test
      - run: pnpm --filter @workspace/api-server typecheck
      - run: pnpm --filter @workspace/api-server build
