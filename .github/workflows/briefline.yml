name: Briefline Telegram digests

on:
  # These four UTC hours map to four Israel-time slots; the local clock
  # shifts by one hour between standard time and daylight saving time.
  schedule:
    - cron: "05 5,9,13,17 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: briefline-neon-job
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/api-server run build
      - run: node artifacts/api-server/dist/github.mjs
