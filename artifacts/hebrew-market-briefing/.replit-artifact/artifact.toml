kind = "web"
previewPath = "/hebrew-market-briefing/"
title = "Briefline Telegram Bot"
description = "A minimal Hebrew launch page for a Telegram-only news bot. All pairing, settings, and updates happen in Telegram."
version = "1.0.0"
id = "artifacts/hebrew-market-briefing"
router = "path"

[[services]]
name = "web"
paths = [ "/hebrew-market-briefing/" ]
localPort = 20410

[services.development]
run = "pnpm --filter @workspace/hebrew-market-briefing run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/hebrew-market-briefing", "run", "build" ]
serve = "static"
publicDir = "artifacts/hebrew-market-briefing/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20410"
BASE_PATH = "/hebrew-market-briefing/"
